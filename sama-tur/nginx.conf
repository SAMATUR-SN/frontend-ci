# Configuration du serveur (bloc `server`), copiée dans /etc/nginx/conf.d/default.conf de l'image
# nginxinc/nginx-unprivileged : le fichier principal d'nginx l'inclut déjà.
#
# Pas de proxy /api : en production, Traefik route /api vers le backend, sur la même origine.
# Pas de Content-Security-Policy tant qu'elle n'a pas été éprouvée dans un navigateur.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Santé : même contrat que le spike de déploiement sans coupure (deployment-cd).
    # 200 « ok » ; 503 « draining » si /tmp/draining existe (créé par le hook de déploiement
    # avant l'arrêt de l'ancien conteneur : Traefik le retire alors du routage).
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        if (-f /tmp/draining) {
            return 503 'draining';
        }
        return 200 'ok';
    }

    # La page d'entrée ne doit jamais être mise en cache : elle désigne les fichiers hachés du build.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Fichiers hachés par le build (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css) :
    # leur nom change quand leur contenu change, ils se gardent un an.
    location ~ "-[A-Za-z0-9_]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Application monopage : toute adresse inconnue du disque rend index.html (l'application route).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
