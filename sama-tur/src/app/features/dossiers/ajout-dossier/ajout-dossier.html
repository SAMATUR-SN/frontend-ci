<div class="page-container">
  <div class="page-header">
    <div>
      <a routerLink="/dossiers" class="back-link">← Retour aux dossiers</a>
      <h1>Créer un dossier</h1>
      <p>Associez un dossier administratif à un élève déjà enregistré.</p>
    </div>
  </div>

  <section class="form-card">
    <h2>Informations du dossier</h2>

    <div *ngIf="messageErreur" class="message-error">
      {{ messageErreur }}
    </div>

    <div *ngIf="messageSucces" class="message-success">
      {{ messageSucces }}
    </div>

    <div *ngIf="chargementEleves" class="message-info">
      Chargement des élèves...
    </div>

    <form [formGroup]="formulaire" (ngSubmit)="creerDossier()">
      <div class="form-group">
        <label for="reference">Référence du dossier *</label>
        <input
          id="reference"
          type="text"
          formControlName="reference"
          placeholder="Ex. DOS-2026-001"
        />

        <small
            class="field-error"
            *ngIf="formulaire.controls.reference.touched &&
                    formulaire.controls.reference.hasError('required')">
            La référence est obligatoire.
        </small>
      </div>

      <div class="form-group">
        <label for="eleveId">Élève concerné *</label>
        <select id="eleveId" formControlName="eleveId">
          <option value="">Sélectionner un élève</option>
          <option *ngFor="let eleve of eleves" [value]="eleve.id">
            {{ eleve.prenom }} {{ eleve.nom }} — {{ eleve.ecole?.nom || 'École non renseignée' }}
          </option>
        </select>

        <small
          class="field-error"
          *ngIf="formulaire.controls.eleveId.touched &&
                 formulaire.controls.eleveId.invalid">
          Veuillez sélectionner un élève.
        </small>
      </div>

      <div class="form-actions">
        <a routerLink="/dossiers" class="btn-cancel">Annuler</a>

        <button
          type="submit"
          class="btn-submit"
          [disabled]="soumissionEnCours || chargementEleves || eleves.length === 0">
          {{ soumissionEnCours ? 'Création...' : 'Créer le dossier' }}
        </button>
      </div>
    </form>
  </section>
</div>
